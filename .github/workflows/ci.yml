name: Portable acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Locked dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install audit tool in disposable CI environment
        run: python -m pip install pip-audit==2.10.1
      - name: Audit exact locked packages against current advisories
        run: python -m pip_audit -r requirements-mcp.lock.txt -r requirements-materials.lock.txt -r requirements-ocr.lock.txt --no-deps --disable-pip --desc off -f json -o dependency-audit.json
      - name: Dependency audit receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 14
  portable:
    name: ${{ matrix.os }} installation and OCR
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Linux OCR system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y curl unzip libgl1 libglib2.0-0
      - name: Fresh ZIP installation, regression, MCP and OCR
        run: python tools/ci_public.py
      - name: Synthetic acceptance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-${{ matrix.os }}
          path: .local/public-ci/reports/
          if-no-files-found: warn
          retention-days: 14
