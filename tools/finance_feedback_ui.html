<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>财务反馈汇总</title><link rel="icon" href="data:,">
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#203044;background:#f7f8fa;font-size:15px}body{margin:0}header,main{max-width:1120px;margin:auto;padding:28px 36px}header{border-bottom:1px solid #dce2e8}h1{font-size:28px;margin:0 0 10px}p{line-height:1.7}button,input,select{font:inherit}button{border:1px solid #cbd5e1;border-radius:6px;padding:9px 14px;background:white;color:#203044;cursor:pointer}button.primary{background:#245bc4;color:white;border-color:#245bc4}button:disabled{opacity:.5;cursor:default}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input{padding:9px 12px;border:1px solid #cbd5e1;border-radius:6px;flex:1;min-width:180px}.muted{color:#607185;font-size:13px}.status{min-height:22px;color:#245bc4}article{padding:26px 0;border-bottom:1px solid #dce2e8}article h2{font-size:19px;margin:0 0 10px}article .meta{display:flex;gap:20px;flex-wrap:wrap;color:#607185;font-size:13px}pre{font:inherit;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;padding:18px 0;margin:0}.row-actions{display:flex;gap:10px;align-items:center}.badge{font-size:13px;color:#965400;background:#fff3db;padding:3px 8px}.hidden{display:none}dialog{border:1px solid #cbd5e1;border-radius:8px;max-width:740px;width:80vw}dialog textarea{width:100%;height:300px;box-sizing:border-box;font:inherit}a{color:#245bc4}@media(max-width:650px){header,main{padding:24px 18px}}@media(prefers-reduced-motion:no-preference){article{animation:appear .2s ease-out}button{transition:background .15s,opacity .15s}@keyframes appear{from{opacity:.7;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style></head><body>
<header><h1>财务反馈汇总</h1><p id="summary"></p><p class="muted" id="observed"></p><div class="toolbar"><input id="query" type="search" aria-label="搜索单号、事项或原文" placeholder="搜索单号、事项或反馈原文"><button id="select">选择当前结果</button><button id="copy" class="primary">复制所选原文</button><button id="download">下载所选文本</button></div><p class="muted" id="selection-scope"></p><p class="status" id="status" role="status"></p></header>
<main><p class="muted">勾选需要汇总的单据，复制内容会保留单号、状态和完整反馈原文。此页面是采集时的快照。刷新网页不会更新财务数据，最新状态需要重新采集。</p><div id="rows"></div></main>
<dialog id="manual"><h2>复制原文</h2><p>浏览器未允许自动复制。内容已选中，请按Ctrl+C复制。</p><textarea id="manual-text" readonly></textarea><p><button id="close">关闭</button></p></dialog>
<script id="report" type="application/json">/*REPORT_DATA*/{}</script>
<script src="财务反馈汇总.js"></script></body></html>
